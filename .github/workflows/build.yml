name: Build Glass Notify APK

# Этот файл больше менять не нужно.
# Код приложения лежит в source.zip в корне репозитория (или обычными файлами проекта).
# Обновил source.zip, запушил в main: APK соберётся сам.
# Вручную: Actions -> Build Glass Notify APK -> Run workflow (можно поменять параметры).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      hold_ms:
        description: 'Сколько мс плашка висит до ухода'
        default: '3200'
      stop_delay_ms:
        description: 'Через сколько мс после закрытия плашки останавливать запись экрана'
        default: '2000'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack source.zip (если есть)
        run: |
          if [ -f source.zip ]; then
            unzip -o source.zip
          else
            echo "source.zip не найден, собираю файлы проекта из репозитория"
          fi
          test -f settings.gradle.kts || (echo "Нет файлов проекта: положи source.zip в корень репозитория" && exit 1)

      - name: Write Config.kt from inputs
        env:
          HOLD: ${{ inputs.hold_ms || '3200' }}
          STOP: ${{ inputs.stop_delay_ms || '2000' }}
        run: |
          case "$HOLD" in ''|*[!0-9]*) HOLD=3200 ;; esac
          case "$STOP" in ''|*[!0-9]*) STOP=2000 ;; esac
          mkdir -p app/src/main/java/app/glassnotify
          printf 'package app.glassnotify\n\nobject Config {\n    const val HOLD_MS = %sL\n    const val STOP_DELAY_MS = %sL\n}\n' "$HOLD" "$STOP" > app/src/main/java/app/glassnotify/Config.kt
          cat app/src/main/java/app/glassnotify/Config.kt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Keep APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: glass-notify-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK in Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Glass Notify build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
