          cat > app/src/main/java/app/glassnotify/GlassView.kt <<'EOF'
          package app.glassnotify

          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.BitmapShader
          import android.graphics.Canvas
          import android.graphics.Paint
          import android.graphics.RuntimeShader
          import android.graphics.Shader
          import android.view.View

          /**
           * Порт шейдера с сайта «Liquid Glass: капля» на AGSL, без изменений в математике:
           * скруглённый прямоугольник, слияние с «островом» через smin, волна при движении,
           * преломление картинки под плашкой (6 проб, хроматическая аберрация), блик, кромка и фаска.
           * Картинка под плашкой (uTex) — снимок верхней полосы экрана из CaptureService.
           * Если снимка нет, рисуется тёмное стекло с теми же бликами.
           */
          class GlassView(context: Context) : View(context) {

              private val shader = RuntimeShader(AGSL)
              private val paint = Paint()
              private val dummy = Bitmap.createBitmap(1, 1, Bitmap.Config.ARGB_8888)

              private var rect = floatArrayOf(0f, 0f, 1f, 1f)
              private var pill = floatArrayOf(0f, 0f, 1f, 1f)
              private var glassAlpha = 0f
              private var ab = 0.3f
              private var rad = 1f
              private var dpr = 1f
              private var wob = 0f
              private var time = 0f
              private var pillOn = 0f
              private var hasTex = 0f

              init {
                  paint.shader = shader
                  setTexture(null)
              }

              fun setTexture(bm: Bitmap?) {
                  hasTex = if (bm != null) 1f else 0f
                  shader.setInputShader(
                      "uTex",
                      BitmapShader(bm ?: dummy, Shader.TileMode.CLAMP, Shader.TileMode.CLAMP)
                  )
              }

              fun update(
                  cx: Float, cy: Float, hw: Float, hh: Float,
                  pcx: Float, pcy: Float, phw: Float, phh: Float,
                  alpha: Float, ab: Float, rad: Float, dpr: Float, wob: Float, time: Float, pillOn: Float
              ) {
                  rect = floatArrayOf(cx, cy, hw, hh)
                  pill = floatArrayOf(pcx, pcy, phw, phh)
                  this.glassAlpha = alpha
                  this.ab = ab
                  this.rad = rad
                  this.dpr = dpr
                  this.wob = wob
                  this.time = time
                  this.pillOn = pillOn
                  invalidate()
              }

              override fun onDraw(canvas: Canvas) {
                  shader.setFloatUniform("uSize", width.toFloat(), height.toFloat())
                  shader.setFloatUniform("uRect", rect[0], rect[1], rect[2], rect[3])
                  shader.setFloatUniform("uPill", pill[0], pill[1], pill[2], pill[3])
                  shader.setFloatUniform("uAlpha", glassAlpha)
                  shader.setFloatUniform("uAb", ab)
                  shader.setFloatUniform("uRad", rad)
                  shader.setFloatUniform("uDpr", dpr)
                  shader.setFloatUniform("uWob", wob)
                  shader.setFloatUniform("uTime", time)
                  shader.setFloatUniform("uHasTex", hasTex)
                  shader.setFloatUniform("uPillOn", pillOn)
                  canvas.drawRect(0f, 0f, width.toFloat(), height.toFloat(), paint)
              }

              companion object {
                  private val AGSL = """
                      uniform shader uTex;
                      uniform float2 uSize;
                      uniform float4 uRect;
                      uniform float4 uPill;
                      uniform float uAlpha;
                      uniform float uAb;
                      uniform float uRad;
                      uniform float uDpr;
                      uniform float uWob;
                      uniform float uTime;
                      uniform float uHasTex;
                      uniform float uPillOn;

                      float3 tp(float2 p) {
                          return float3(uTex.eval(clamp(p, float2(0.5), uSize - float2(0.5))).rgb);
                      }

                      float sdR(float2 p, float2 c, float2 hb, float r) {
                          float2 q = abs(p - c) - (hb - float2(r));
                          return length(max(q, float2(0.0))) + min(max(q.x, q.y), 0.0) - r;
                      }

                      float smin2(float a, float b, float k) {
                          float h = max(k - abs(a - b), 0.0) / k;
                          return min(a, b) - h * h * k * 0.25;
                      }

                      float field(float2 p, float gNear, float r) {
                          float dB = sdR(p, uRect.xy, uRect.zw, r);
                          float dP = sdR(p, uPill.xy, uPill.zw, uPill.w);
                          float d = mix(dB, smin2(dB, dP, 26.0 * uDpr), gNear);
                          return d + uWob * sin(p.x * 0.05 + uTime * 11.0) * sin(p.y * 0.06 + uTime * 8.0);
                      }

                      half4 main(float2 fc) {
                          float2 p = fc;
                          float r = max(min(uRad, min(uRect.z, uRect.w)), 1.0);
                          float gNear = uPillOn * (1.0 - smoothstep(0.0, 40.0 * uDpr,
                              sdR(uPill.xy, uRect.xy, uRect.zw, r)));
                          float d = field(p, gNear, r);
                          float ins = 1.0 - smoothstep(-1.0, 0.75, d);
                          if (ins <= 0.0 || uAlpha < 0.001) {
                              return half4(0.0);
                          }
                          float e = uDpr;
                          float2 n = normalize(float2(
                              field(p + float2(e, 0.0), gNear, r) - field(p - float2(e, 0.0), gNear, r),
                              field(p + float2(0.0, e), gNear, r) - field(p - float2(0.0, e), gNear, r)
                          ) + float2(0.0001));
                          float depth = clamp(-d / r, 0.0, 1.0);
                          float edge = pow(1.0 - depth, 2.2);
                          float2 dir = p - uRect.xy;

                          float2 L = normalize(float2(-0.6, -0.8));
                          float lit = pow(max(dot(n, L), 0.0), 2.0) + 0.6 * pow(max(dot(n, -L), 0.0), 2.0);
                          float band = 1.0 - smoothstep(0.0, 0.25, depth);
                          float hair = 1.0 - smoothstep(0.0, 1.8 * uDpr, -d);
                          float topv = smoothstep(0.0, 1.0,
                              1.0 - (p.y - (uRect.y - uRect.w)) / max(2.0 * uRect.w, 1.0)) * 0.10;
                          float g = (0.45 * band * band * lit + 0.38 * hair) * 1.2 + topv * 1.2;

                          float3 col = float3(0.0);
                          float a = 1.0;
                          if (uHasTex > 0.5) {
                              float2 c0 = uRect.xy + dir / 1.06;
                              float k = edge * 1.2 * 28.0 * uDpr;
                              float abv = uAb * 0.35;
                              float br = 6.0 * uDpr;
                              for (int i = 0; i < 6; i++) {
                                  float an = float(i) * 1.0472;
                                  float2 o = float2(cos(an), sin(an)) * br;
                                  col += float3(
                                      tp(c0 + n * k * (1.0 + abv) + o).r,
                                      tp(c0 + n * k + o).g,
                                      tp(c0 + n * k * (1.0 - abv) + o).b);
                              }
                              col = col / 6.0 * 0.74 + float3(0.05);
                          } else {
                              col = float3(0.13, 0.14, 0.18);
                              a = 0.5;
                          }

                          float pm = gNear * (1.0 - smoothstep(-2.0 * uDpr, 2.0 * uDpr,
                              sdR(p, uPill.xy, uPill.zw, uPill.w)));
                          col = mix(col, float3(0.0), pm);
                          a = mix(a, 1.0, pm);

                          col = clamp(col + float3(g), 0.0, 1.0);
                          float aF = clamp(a + g, 0.0, 1.0);
                          float o2 = ins * uAlpha;
                          return half4(half3(col * aF * o2), half(aF * o2));
                      }
                  """.trimIndent()
              }
          }
          EOF
          cat > app/src/main/java/app/glassnotify/Capture.kt <<'EOF'
          package app.glassnotify

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.Bitmap
          import android.graphics.PixelFormat
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.Handler
          import android.os.HandlerThread
          import android.os.IBinder
          import android.os.SystemClock
          import android.view.WindowManager
          import kotlin.math.min

          /** Общее состояние между сервисом записи экрана и баннером. */
          object Capture {
              /** Последний кадр верхней полосы экрана (без баннера). Битмап после создания не меняется. */
              @Volatile var strip: Bitmap? = null
              /** Пока баннер на экране, новые кадры не сохраняем, чтобы в снимок не попал он сам. */
              @Volatile var paused = false
              @Volatile var active = false
              @Volatile var width = 0
              @Volatile var stripH = 0
          }

          class CaptureService : Service() {

              private var projection: MediaProjection? = null
              private var display: VirtualDisplay? = null
              private var reader: ImageReader? = null
              private var thread: HandlerThread? = null
              private var lastT = 0L

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val code = intent?.getIntExtra("code", 0) ?: 0
                  val data: Intent? = intent?.getParcelableExtra("data", Intent::class.java)
                  if (data == null) {
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  startAsForeground()
                  try {
                      startCapture(code, data)
                  } catch (e: Exception) {
                      Capture.active = false
                      stopSelf()
                  }
                  return START_NOT_STICKY
              }

              private fun startAsForeground() {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(
                      NotificationChannel("capture", "Преломление фона", NotificationManager.IMPORTANCE_LOW)
                  )
                  val n = Notification.Builder(this, "capture")
                      .setSmallIcon(android.R.drawable.ic_menu_camera)
                      .setContentTitle("Glass Notify")
                      .setContentText("Преломление фона включено")
                      .setOngoing(true)
                      .build()
                  startForeground(7, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
              }

              private fun startCapture(code: Int, data: Intent) {
                  val th = HandlerThread("glass-capture")
                  th.start()
                  thread = th
                  val handler = Handler(th.looper)

                  val mpm = getSystemService(MediaProjectionManager::class.java)
                  val mp = mpm.getMediaProjection(code, data)
                  projection = mp
                  // Android 14+: колбэк нужно зарегистрировать до createVirtualDisplay.
                  mp.registerCallback(object : MediaProjection.Callback() {
                      override fun onStop() {
                          Capture.active = false
                          stopSelf()
                      }
                  }, handler)

                  val bounds = getSystemService(WindowManager::class.java).maximumWindowMetrics.bounds
                  val w = bounds.width()
                  val h = bounds.height()
                  val density = resources.displayMetrics.density
                  val stripH = min(h, (240 * density).toInt())
                  Capture.width = w
                  Capture.stripH = stripH

                  val r = ImageReader.newInstance(w, h, PixelFormat.RGBA_8888, 3)
                  reader = r
                  r.setOnImageAvailableListener({ rd -> onImage(rd) }, handler)
                  display = mp.createVirtualDisplay(
                      "glass-notify", w, h, resources.displayMetrics.densityDpi,
                      DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, r.surface, null, null
                  )
                  Capture.active = true
              }

              private fun onImage(rd: ImageReader) {
                  val img = try {
                      rd.acquireLatestImage()
                  } catch (e: Exception) {
                      null
                  } ?: return
                  try {
                      if (Capture.paused) return
                      val now = SystemClock.uptimeMillis()
                      if (now - lastT < 100) return
                      lastT = now
                      val plane = img.planes[0]
                      val rowPx = plane.rowStride / plane.pixelStride
                      val sh = Capture.stripH
                      val tmp = Bitmap.createBitmap(rowPx, sh, Bitmap.Config.ARGB_8888)
                      val buf = plane.buffer
                      buf.rewind()
                      tmp.copyPixelsFromBuffer(buf)
                      Capture.strip =
                          if (rowPx == Capture.width) tmp
                          else Bitmap.createBitmap(tmp, 0, 0, Capture.width, sh)
                  } catch (e: Exception) {
                      // пропускаем кадр
                  } finally {
                      img.close()
                  }
              }

              override fun onDestroy() {
                  Capture.active = false
                  Capture.strip = null
                  runCatching { display?.release() }
                  runCatching { reader?.close() }
                  runCatching { projection?.stop() }
                  runCatching { thread?.quitSafely() }
                  super.onDestroy()
              }
          }
          EOF
          cat > app/src/main/java/app/glassnotify/GlassBanner.kt <<'EOF'
          package app.glassnotify

          import android.app.ActivityOptions
          import android.app.Dialog
          import android.app.PendingIntent
          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Outline
          import android.graphics.Path
          import android.graphics.PixelFormat
          import android.graphics.RectF
          import android.graphics.RenderEffect
          import android.graphics.Shader
          import android.graphics.Typeface
          import android.graphics.drawable.ColorDrawable
          import android.graphics.drawable.Drawable
          import android.os.Build
          import android.text.TextUtils
          import android.util.TypedValue
          import android.view.Choreographer
          import android.view.ContextThemeWrapper
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewGroup
          import android.view.ViewOutlineProvider
          import android.view.WindowManager
          import android.widget.FrameLayout
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.TextView
          import kotlin.math.abs
          import kotlin.math.ceil
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.sqrt

          /**
           * Баннер уведомления. Анимация перенесена с сайта «Liquid Glass: капля» один в один:
           * одна пружина прогресса (k=150, ζ=0.76) ведёт положение, ширину, высоту и появление текста;
           * уход: k=260, ζ=0.95; прозрачность стекла гаснет пружиной (k=420) через 260 мс.
           * Окно статичное (ширина экрана, верхняя полоса), капля рисуется шейдером внутри него.
           */
          object GlassBanner {

              private var cur: Run? = null

              fun show(
                  ctx: Context,
                  appName: String,
                  title: String,
                  text: String,
                  icon: Drawable?,
                  contentIntent: PendingIntent?,
                  durationMs: Long
              ) {
                  cur?.kill()
                  cur = null
                  try {
                      val r = Run(ctx, appName, title, text, icon, contentIntent, durationMs) { done ->
                          if (cur === done) cur = null
                      }
                      cur = r
                      r.start()
                  } catch (e: Exception) {
                      Capture.paused = false
                      cur = null
                  }
              }

              fun dismiss(animated: Boolean) {
                  val r = cur ?: return
                  if (animated) r.leave() else r.kill()
              }
          }

          private class Sp(var x: Float, var t: Float, var k: Float, r: Float) {
              var d = 2f * r * sqrt(k)
              var v = 0f

              fun tune(nk: Float, nr: Float) {
                  k = nk
                  d = 2f * nr * sqrt(nk)
              }

              fun step(dt: Float) {
                  val n = max(1, ceil(dt * 240f).toInt())
                  val h = dt / n
                  for (i in 0 until n) {
                      v += (-k * (x - t) - d * v) * h
                      x += v * h
                  }
              }
          }

          private class ClipFrame(context: Context) : FrameLayout(context) {
              private val rect = RectF()
              private val path = Path()
              private var rad = 0f

              fun setLens(l: Float, t: Float, r: Float, b: Float, radius: Float) {
                  rect.set(l, t, r, b)
                  rad = radius
                  invalidate()
              }

              override fun dispatchDraw(canvas: Canvas) {
                  val sc = canvas.save()
                  path.reset()
                  path.addRoundRect(rect, rad, rad, Path.Direction.CW)
                  canvas.clipPath(path)
                  super.dispatchDraw(canvas)
                  canvas.restoreToCount(sc)
              }
          }

          private class Run(
              private val ctx: Context,
              private val appName: String,
              private val title: String,
              private val text: String,
              private val icon: Drawable?,
              private val contentIntent: PendingIntent?,
              private val holdMs: Long,
              private val onDone: (Run) -> Unit
          ) {
              private val themed = ContextThemeWrapper(ctx, R.style.Theme_GlassDialog)
              private val choreo = Choreographer.getInstance()
              private val cb = Choreographer.FrameCallback { t -> frame(t) }

              private var D = 1f
              private var W = 0f
              private var sw = 0f
              private var sh = 0f
              private var fw = 0f
              private var fh = 0f
              private var sy = 0f
              private var endY = 0f
              private var pillCx = 0f
              private var pillCy = 0f
              private var pillHw = 0f
              private var pillHh = 0f
              private var pillOn = 0f

              private val p = Sp(0f, 0f, 150f, 0.76f)
              private val a = Sp(100f, 100f, 260f, 1f)
              private var el = 0f
              private var ex = 0f
              private var out = false
              private var set = false
              private var wob = 0f
              private var held = false
              private var dragOff = 0f
              private var downY = 0f
              private var lastNs = 0L
              private var startNs = 0L
              private var dead = false

              private var lensL = 0f
              private var lensT = 0f
              private var lensR = 0f
              private var lensB = 0f

              private lateinit var dialog: Dialog
              private lateinit var glass: GlassView
              private lateinit var clip: ClipFrame
              private lateinit var card: LinearLayout

              fun start() {
                  Capture.paused = true
                  val res = themed.resources
                  D = res.displayMetrics.density
                  W = res.displayMetrics.widthPixels.toFloat()
                  sw = 30f * D
                  sh = 30f * D
                  fh = 68f * D
                  fw = min(W - 20f * D, 520f * D)

                  val sbId = res.getIdentifier("status_bar_height", "dimen", "android")
                  val statusBar = if (sbId > 0) res.getDimensionPixelSize(sbId).toFloat() else 24f * D

                  // «Остров» берём из выреза экрана. Нет выреза: форма без слияния, старт из центра у статус-бара.
                  val rects = try {
                      themed.getSystemService(WindowManager::class.java)
                          .currentWindowMetrics.windowInsets.displayCutout?.boundingRects
                  } catch (e: Exception) {
                      null
                  }
                  val cut = rects?.filter { it.top == 0 && it.bottom < 120f * D }?.minByOrNull { it.top }
                  if (cut != null) {
                      pillCx = cut.exactCenterX()
                      pillCy = cut.exactCenterY()
                      pillHw = cut.width() / 2f + 3f * D
                      pillHh = cut.height() / 2f + 3f * D
                      pillOn = 1f
                  } else {
                      pillCx = W / 2f
                      pillCy = statusBar / 2f
                      pillHw = 46f * D
                      pillHh = 13f * D
                      pillOn = 0f
                  }
                  sy = pillCy - sh / 2f
                  endY = pillCy + pillHh + 10f * D
                  val areaH = endY + fh + 28f * D

                  // Содержимое: размер фиксированный, окно (клип) его открывает.
                  card = LinearLayout(themed).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding((14 * D).toInt(), 0, (16 * D).toInt(), 0)
                  }
                  val iconView = ImageView(themed).apply {
                      setImageDrawable(icon)
                      scaleType = ImageView.ScaleType.CENTER_CROP
                      layoutParams = LinearLayout.LayoutParams((44 * D).toInt(), (44 * D).toInt()).apply {
                          marginEnd = (12 * D).toInt()
                      }
                      clipToOutline = true
                      outlineProvider = object : ViewOutlineProvider() {
                          override fun getOutline(view: View, outline: Outline) {
                              outline.setRoundRect(0, 0, view.width, view.height, 14f * D)
                          }
                      }
                  }
                  val texts = LinearLayout(themed).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                  }
                  fun label(value: String, sp: Float, alpha: Float, bold: Boolean) = TextView(themed).apply {
                      this.text = value
                      setTextSize(TypedValue.COMPLEX_UNIT_SP, sp)
                      setTextColor(Color.argb((alpha * 255).toInt(), 255, 255, 255))
                      setShadowLayer(6f * D, 0f, 1f * D, 0x66000000)
                      if (bold) typeface = Typeface.DEFAULT_BOLD
                      maxLines = 1
                      ellipsize = TextUtils.TruncateAt.END
                  }
                  texts.addView(label(appName, 11f, 0.75f, false))
                  texts.addView(label(title.ifBlank { appName }, 15f, 1f, true))
                  if (text.isNotBlank()) texts.addView(label(text, 14f, 0.92f, false))
                  card.addView(iconView)
                  card.addView(texts)
                  card.alpha = 0f

                  glass = GlassView(themed)
                  val bm = Capture.strip
                  if (bm != null && bm.width == W.toInt() && bm.height >= areaH.toInt()) {
                      glass.setTexture(bm)
                  }

                  clip = ClipFrame(themed)
                  clip.addView(card, FrameLayout.LayoutParams(fw.toInt(), fh.toInt()))

                  val root = FrameLayout(themed)
                  root.addView(glass, FrameLayout.LayoutParams(-1, -1))
                  root.addView(clip, FrameLayout.LayoutParams(-1, -1))
                  root.setOnTouchListener { _, ev -> onTouch(ev) }

                  dialog = Dialog(themed, R.style.Theme_GlassDialog)
                  dialog.setCancelable(false)
                  dialog.setCanceledOnTouchOutside(false)
                  val win = dialog.window!!
                  win.setType(WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY)
                  win.addFlags(
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS
                  )
                  win.clearFlags(WindowManager.LayoutParams.FLAG_DIM_BEHIND)
                  win.setBackgroundDrawable(ColorDrawable(Color.TRANSPARENT))
                  win.setGravity(Gravity.TOP or Gravity.START)
                  val lp = win.attributes
                  lp.format = PixelFormat.TRANSLUCENT
                  lp.width = W.toInt()
                  lp.height = areaH.toInt()
                  lp.x = 0
                  lp.y = 0
                  lp.layoutInDisplayCutoutMode =
                      WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS
                  win.attributes = lp
                  dialog.setContentView(root, ViewGroup.LayoutParams(-1, -1))
                  dialog.show()
                  choreo.postFrameCallback(cb)
              }

              fun leave() {
                  if (out) return
                  out = true
                  ex = 0f
                  p.t = 0f
                  p.tune(260f, 0.95f)
                  a.tune(420f, 1f)
              }

              private fun frame(nowNs: Long) {
                  if (dead) return
                  val dt = if (lastNs == 0L) 1f / 60f else ((nowNs - lastNs) / 1e9f).coerceIn(0.001f, 0.033f)
                  lastNs = nowNs
                  if (startNs == 0L) startNs = nowNs
                  val ms = dt * 1000f

                  if (!out) {
                      if (!held) el += ms
                      if (!set && el >= 60f) {
                          set = true
                          p.t = 1f
                      }
                      if (el > holdMs) leave()
                  } else {
                      ex += ms
                      if (ex > 260f) a.t = 0f
                      if (ex > 1100f) {
                          finish()
                          return
                      }
                  }
                  p.step(dt)
                  a.step(dt)
                  if (!held) dragOff -= dragOff * min(1f, dt * 10f)

                  val q = p.x
                  val y = sy + (endY - sy) * q + dragOff
                  val w = (sw + (fw - sw) * q).coerceIn(1f, W)
                  val h = max(1f, sh + (fh - sh) * q)
                  val cx = pillCx + (W / 2f - pillCx) * q.coerceIn(0f, 1f)
                  val ca = ((q - 0.3f) / 0.5f).coerceIn(0f, 1f)
                  val sp = abs(p.v) * (endY - sy) / D
                  wob += (min(2f, sp / 220f) - wob) * min(1f, dt * 10f)

                  glass.update(
                      cx, y + h / 2f, w / 2f, h / 2f,
                      pillCx, pillCy, pillHw, pillHh,
                      (a.x / 100f).coerceIn(0f, 1f),
                      (0.3f + sp / 1800f).coerceIn(0f, 1f),
                      28f * D, D, wob * D,
                      (nowNs - startNs) / 1e9f,
                      pillOn
                  )

                  val e = ca * ca * (3f - 2f * ca)
                  card.translationX = cx - fw / 2f
                  card.translationY = y + h / 2f - fh / 2f
                  card.alpha = e
                  val s = 0.92f + 0.08f * e
                  card.scaleX = s
                  card.scaleY = s
                  val blur = (1f - e) * 5f * D
                  card.setRenderEffect(
                      if (blur > 0.5f) RenderEffect.createBlurEffect(blur, blur, Shader.TileMode.CLAMP) else null
                  )
                  clip.setLens(cx - w / 2f, y, cx + w / 2f, y + h, min(28f * D, h / 2f))
                  lensL = cx - w / 2f
                  lensR = cx + w / 2f
                  lensT = y
                  lensB = y + h

                  choreo.postFrameCallback(cb)
              }

              private fun onTouch(ev: MotionEvent): Boolean {
                  when (ev.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          if (ev.x < lensL || ev.x > lensR || ev.y < lensT || ev.y > lensB) return false
                          held = true
                          downY = ev.rawY
                          dragOff = 0f
                          return true
                      }
                      MotionEvent.ACTION_MOVE -> {
                          if (!held) return false
                          dragOff = min(0f, ev.rawY - downY)
                          return true
                      }
                      MotionEvent.ACTION_UP -> {
                          if (!held) return false
                          held = false
                          val moved = ev.rawY - downY
                          if (moved < -24f * D) {
                              leave()
                          } else if (abs(moved) < 10f * D) {
                              contentIntent?.let { fire(it) }
                              leave()
                          }
                          return true
                      }
                      MotionEvent.ACTION_CANCEL -> {
                          held = false
                          return true
                      }
                  }
                  return false
              }

              private fun fire(pi: PendingIntent) {
                  try {
                      if (Build.VERSION.SDK_INT >= 34) {
                          val options = ActivityOptions.makeBasic()
                          options.setPendingIntentBackgroundActivityStartMode(
                              ActivityOptions.MODE_BACKGROUND_ACTIVITY_START_ALLOWED
                          )
                          pi.send(ctx, 0, null, null, null, null, options.toBundle())
                      } else {
                          pi.send()
                      }
                  } catch (e: Exception) {
                      // интент мог быть отозван приложением-источником
                  }
              }

              fun kill() = finish()

              private fun finish() {
                  if (dead) return
                  dead = true
                  choreo.removeFrameCallback(cb)
                  runCatching { dialog.dismiss() }
                  Capture.paused = false
                  onDone(this)
              }
          }
